---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  annotations:
    autoscaling.knative.dev/target: "10"
  name: llama3-8b-instruct-1xgpu
  namespace: nim-kserve-pvc
spec:
  predictor:
    annotations:
      prometheus.io/path: /metrics
      prometheus.io/port: "8000"
      serving.knative.openshift.io/enablePassthrough: "true"
      sidecar.istio.io/inject: "true"
      sidecar.istio.io/rewriteAppHTTPProbers: "true"
    minReplicas: 1
    nodeSelector:
      node.kubernetes.io/instance-type: p4d.24xlarge
    tolerations:
      - effect: NoSchedule
        key: p4-gpu
        operator: Exists
    containers:
      - env:
          - name: NIM_CACHE_PATH
            value: /mnt/nim/models
          - name: NGC_API_KEY
            valueFrom:
              secretKeyRef:
                key: NGC_API_KEY
                name: nvidia-nim-secrets
        image: nvcr.io/nim/meta/llama3-8b-instruct:1.0.0
        name: kserve-container
        ports:
          - containerPort: 8000
            protocol: TCP
        resources:
          limits:
            cpu: "12"
            memory: 256Gi
          requests:
            cpu: "12"
            memory: 128Gi
        volumeMounts:
          - mountPath: /dev/shm
            name: dshm
          - mountPath: /mnt/nim/models
            name: nim-pvc
    imagePullSecrets:
      - name: ngc-secret
    volumes:
      - emptyDir:
          medium: Memory
          sizeLimit: 128Gi
        name: dshm
      - name: nim-pvc
        persistentVolumeClaim:
          claimName: nim-pvc
